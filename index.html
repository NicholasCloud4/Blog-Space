<!DOCTYPE html>
<html>

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <title>Blog Space</title>
</head>

<body>
    <nav>
        <div class="navbar-container">
            <h1 class="navbar-title">Blog Space</h1>
        </div>
    </nav>


    <form id="new-post">
        <label for="post-title">Title:</label>
        <input id="post-title" type="text" />

        <label for="post-body">Body:</label>
        <textarea id="post-body"></textarea>

        <button>Post</button>
    </form>


    <div id="blog-list">
        <!-- Blog listings will be dynamically added here -->
    </div>
    <script src="index.js"></script>
</body>

</html>
